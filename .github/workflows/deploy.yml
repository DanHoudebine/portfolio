name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Modern GitHub Pages deployment — no gh-pages branch needed.
# REQUIRED ONE-TIME SETUP in repo Settings → Pages:
#   Source: "GitHub Actions"   (NOT "Deploy from a branch")

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip queued in-between runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Compress render images in the build output only (repo keeps originals).
      # Caps the long edge to 1800px, strips metadata, re-encodes. Keeps each
      # file's format/name so src/content/renders.json references stay valid.
      - name: Optimize render images
        run: |
          # A broken third-party apt repo must not block the deploy: ignore update errors,
          # and if the tools still can't be installed, ship the images uncompressed.
          sudo apt-get update || echo "::warning::apt-get update had errors"
          if ! sudo apt-get install -y --no-install-recommends imagemagick pngquant; then
            echo "::warning::image tools unavailable, skipping render optimization"; exit 0
          fi
          shopt -s nullglob nocaseglob
          for f in dist/renders/*.png dist/renders/*.jpg dist/renders/*.jpeg; do
            [ -f "$f" ] || continue
            before=$(stat -c%s "$f")
            mogrify -resize '1800x1800>' -strip "$f"
            case "$f" in
              *.png) pngquant --force --skip-if-larger --quality=70-92 --output "$f" "$f" || true ;;
              *)     mogrify -quality 85 "$f" ;;
            esac
            printf '  %s: %s -> %s bytes\n' "$(basename "$f")" "$before" "$(stat -c%s "$f")"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
